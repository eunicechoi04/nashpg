lr: 3e-4
ent_coef: 0.05
clip_eps: 0.2
num_envs: 32
num_steps: 128
gamma: 1.0
gae_gamma: 0.95
num_minibatches: 4
num_ppo_epoch: 4
mag_coef: 0.2
mag_divergence_type: "kl"
num_inner_update: 1000
num_outer_update: 35

# Warmup schedule parameters for Method A (Fixed α with Warmup Schedule)
alpha_schedule_type: "none"  # Options: "none", "linear", "exponential", "cosine"
alpha_high: 0.4              # Initial regularization (used when schedule is active)
alpha_target: 0.2            # Final regularization target (defaults to mag_coef if not using schedule)
T_warmup: 10                 # Number of warmup iterations (outer loop iterations)
lambda_exp: 0.2              # Lambda parameter for exponential decay