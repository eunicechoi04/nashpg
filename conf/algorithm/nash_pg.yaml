lr: 3e-4
ent_coef: 0.05
clip_eps: 0.2
num_envs: 32
num_steps: 128
gamma: 1.0
gae_gamma: 0.95
num_minibatches: 4
num_ppo_epoch: 4
mag_coef: 0.2
mag_divergence_type: "kl"
num_inner_update: 1000
num_outer_update: 50

# Adaptive KL Penalty settings
adaptive_kl_penalty: true        # Enable adaptive KL penalty mechanism
target_kl: 0.03                 # Target KL divergence threshold
kl_adjustment_factor: 1.5       # Factor to multiply/divide mag_coef by
min_mag_coef: 0.001             # Minimum value for mag_coef
max_mag_coef: 1.0               # Maximum value for mag_coef